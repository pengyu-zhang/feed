name: yt-probe

on:
  workflow_dispatch:
    inputs:
      video_ids:
        description: "YouTube video IDs, space separated"
        required: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install youtube-transcript-api
      - name: Try to fetch subtitles
        working-directory: scripts
        env:
          VIDEO_IDS: ${{ inputs.video_ids }}
        run: python yt_probe.py
