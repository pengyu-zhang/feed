# TEMPORARY test (2026-11-23), delete after use: Gemini summaries of 3 YouTube videos.
name: gemini-youtube-probe

on:
  workflow_dispatch:
    inputs:
      script:
        default: gemini_youtube_diag.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -U google-genai
      - name: Run the probe
        working-directory: scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python ${{ inputs.script }}
