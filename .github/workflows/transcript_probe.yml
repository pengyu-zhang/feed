name: transcript-probe

on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "YouTube video ID"
        required: true
      title:
        description: "Video title"
        required: false
        default: ""
      channel:
        description: "Channel name"
        required: false
        default: ""
      transcript_b64:
        description: "Transcript, gzip then base64"
        required: true
      models:
        description: "Claude models, space separated"
        required: false
        default: "claude-sonnet-5-5 claude-opus-5-5"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm i -g @anthropic-ai/claude-code
      - name: Summarise the transcript with Claude
        working-directory: scripts
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          VIDEO_ID: ${{ inputs.video_id }}
          VIDEO_TITLE: ${{ inputs.title }}
          VIDEO_CHANNEL: ${{ inputs.channel }}
          TRANSCRIPT_B64: ${{ inputs.transcript_b64 }}
          MODELS: ${{ inputs.models }}
        run: python transcript_probe.py
