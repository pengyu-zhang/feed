name: daily

on:
  # GitHub starts scheduled runs late, sometimes by hours (8 to 11 hours on 21-23 November 2026),
  # so three tries a night: the first one to start does the day, the later ones see that and stop.
  # 01:23, 03:23, 05:23 UTC = 02:23, 04:23, 06:23 in Amsterdam in winter, an hour later in summer
  # (GitHub cron is always UTC).
  schedule:
    - cron: "23 1 * * *"
    - cron: "23 3 * * *"
    - cron: "23 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  # Scheduled runs only: has today (Amsterdam date) already been done? A run by hand always goes ahead.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: data/state.json
          sparse-checkout-cone-mode: false
      - id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          tz = ZoneInfo("Europe/Amsterdam")
          try:
              last = json.load(open("data/state.json"))["last_run"]
              done = datetime.fromisoformat(last).astimezone(tz).date() == datetime.now(tz).date()
          except (FileNotFoundError, KeyError):
              done = False
          print("go=" + ("false" if done else "true"))
          EOF

  build:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install -g @anthropic-ai/claude-code

      - name: Fetch new posts
        working-directory: scripts
        run: python fetch.py

      - name: Summarise with Claude
        working-directory: scripts
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: python summarize.py

      # Save first, build after: the pull brings in what the other run (blog or YouTube) pushed
      # meanwhile, so the site built next holds both
      - name: Save data
        run: |
          git config user.name "feed-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "digest $(TZ=Europe/Amsterdam date +%F)"
          # someone may have pushed while this ran (a code change, data from elsewhere)
          git pull --rebase && git push

      - name: Build site
        working-directory: scripts
        run: python build.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # GitHub's Pages API fails now and then ("Fetching artifact metadata failed"): wait, try once more
      - if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
