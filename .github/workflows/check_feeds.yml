name: check-feeds

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Only check these URLs (space separated). Empty = every feed in sources.yml"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check every feed
        working-directory: scripts
        env:
          EXTRA_FEEDS: ${{ inputs.urls }}
        run: python check_feeds.py
