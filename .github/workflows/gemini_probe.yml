name: gemini-probe

on:
  workflow_dispatch:
    inputs:
      video_ids:
        description: "YouTube video IDs, space separated"
        required: true
      model:
        description: "Gemini model"
        required: false
        default: "gemini-3.1-flash-lite"
      media_res:
        description: "LOW, MEDIUM or HIGH"
        required: false
        default: "LOW"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Let Gemini watch the videos
        working-directory: scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VIDEO_IDS: ${{ inputs.video_ids }}
          GEMINI_MODEL: ${{ inputs.model }}
          MEDIA_RES: ${{ inputs.media_res }}
        run: python gemini_probe.py
