# 每天跑的参数。改这里就行，不用动脚本。

timezone: "Europe/Amsterdam"

# 第一次运行、或者上次运行太久以前时，往回看多少小时
first_run_hours: 26
# 某个来源连续几天抓不到时，恢复后最多往回补多少小时
max_catchup_hours: 168
# 同一个来源一天最多收几篇（simonwillison.net 一天能发十几条短链接）
max_per_source: 5

# 用 Claude 会员令牌跑，模型名可以随时换。2026-11-23 起博客和视频统一用 Sonnet 5.5。
models:
  summary: "claude-sonnet-5-5"  # 每篇博客写中英摘要
  picks: "claude-sonnet-5-5"    # 每天挑"该知道的"和"可能喜欢"（picks_enabled 为 true 时才用）
  video: "claude-sonnet-5-5"    # YouTube 视频：读字幕写摘要

# YouTube（你电脑上 Claude 桌面版的定时任务，scripts/youtube.py）：和博客一样抓上次成功之后的新视频
youtube:
  max_videos_per_run: 20  # 一次最多写几个视频的摘要，多出来的留到下次
  max_tries: 3            # 字幕还没生成的视频，最多等几次运行

summary_batch_size: 4
# 每篇喂给模型的正文最多多少字符
max_chars_per_item: 20000

# "可能喜欢"按这些兴趣挑。打分攒够以后改按历史。
interests:
  - knowledge graphs, entity linking
  - recommender systems
  - temporal / time-aware machine learning
  - multimodal learning
  - LLM research and evaluation
  - AI agents and AI coding tools
  - machine learning engineering and data infrastructure

# 顶部两栏推荐（"该知道的""可能喜欢"）。false 时两栏留空，也不花额度去挑。
picks_enabled: false
picks_per_column: 3
